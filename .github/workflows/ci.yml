name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install Pillow
        run: python -m pip install pillow
      - name: Run tests
        run: >
          python -m unittest
          tests.test_geometry tests.test_selection tests.test_settings
          tests.test_hotkey tests.test_startup tests.test_annotate
          tests.test_stitcher tests.test_toolbar tests.test_pin
          tests.test_app tests.test_app_store tests.test_arrow
          tests.test_longshot -v
